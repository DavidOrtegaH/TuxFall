name: Test and deploy TuxFall
on:
  push:
    branches: [main, develop, features, release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - id: version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/release' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/release' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify published version
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${PAGE_URL%/}/version.json?deployment=$GITHUB_SHA" | jq -e --arg version "$EXPECTED_VERSION" --arg revision "$GITHUB_SHA" '.version == $version and .revision == $revision'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
